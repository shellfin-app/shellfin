name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please check the v1 scope in the README and `docs/ARCHITECTURE.md` (section 1.1) first;
        some things, such as port-forwarding UI, ProxyCommand and auto-update, are deliberately out of scope for v1
        but can still be discussed for later.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, or how other tools handle this.
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Connections and authentication
        - ssh config / known_hosts / bookmarks
        - Terminals
        - File tree / SFTP / transfers
        - Editor
        - UI / accessibility
        - Translations
        - Build / packaging
        - Other
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would be willing to work on this.
